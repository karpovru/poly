<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <title>RECKONING</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    }

    body {
      background: #111;
      color: white;
      padding: 16px;
      max-width: 390px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 28px;
    }

    .roles {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 40px;
    }

    .card {
      width: 358px;
      min-height: 220px;
      background-image: url('card-bg.png');
      background-position: center;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      border-radius: 18px;
      padding: 16px;
      border: none;
      transition: 0.2s;
      position: relative;
    }

    .card.dead {
      opacity: 0.45;
    }

    .role-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    input {
      width: 300px;
      height: 42px;
      padding: 12px;
      border-radius: 999px;
      border: none;
      background: rgba(0,0,0,0.45);
      color: white;
      margin-bottom: 12px;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      width: 150px;
      height: 42px;
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      color: white;
      transition: 0.2s;
      background-size: 100% 100%;
      background-position: center;
    }

    .kill-btn {
      background: url('button-small.png') center/cover no-repeat;
    }

    

    .doctor-btn {
      background: url('button-small.png') center/cover no-repeat;
    }

    

    .lover-btn {
      background: url('button-small.png') center/cover no-repeat;
    }

    

    .witch-btn {
      background: url('button-small.png') center/cover no-repeat;
    }

    

    .icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
      flex-shrink: 0;
    }

    button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tutorial-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .tutorial-box {
      width: 100%;
      max-width: 360px;
      background: #1b1b1b;
      border-radius: 28px;
      padding: 24px;
      color: white;
    }

    .tutorial-box h2 {
      font-size: 28px;
      margin-bottom: 14px;
      font-weight: 700;
    }

    .tutorial-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .tutorial-box p {
      opacity: 0.8;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .tutorial-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
      font-size: 15px;
      line-height: 1.5;
    }

    #closeTutorial {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 999px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="tutorialModal" class="tutorial-overlay">
    <div class="tutorial-box">
      <h2>Добро пожаловать!</h2>
      <p>
        Это блокнот ведущего для игры Mafia.
      </p>

      <div class="tutorial-list">
        <div style="display:flex;gap:10px;align-items:flex-start;">
          <img src="skull.png" class="tutorial-icon">
          <div><b>Жив / Убит</b><br>Отмечает выбыл ли игрок.</div>
        </div>
        <div style="display:flex;gap:10px;align-items:flex-start;">
          <img src="heal.png" class="tutorial-icon">
          <div><b>Доктор</b><br>Показывает кого вылечил доктор.</div>
        </div>
        <div style="display:flex;gap:10px;align-items:flex-start;">
          <img src="kiss.png" class="tutorial-icon">
          <div><b>Любовница</b><br>Показывает кого забрала любовница.</div>
        </div>
        <div style="display:flex;gap:10px;align-items:flex-start;">
          <img src="witch.png" class="tutorial-icon">
          <div><b>Ведьма</b><br>Нажимайте кнопку чтобы менять действие:
          <br>• Не выбрано
          <br>• Вылечила
          <br>• Убила
          </div>
        </div>
      </div>

      <button id="closeTutorial">Понятно</button>
    </div>
  </div>

  <button id="resetGame" style="width:358px;height:56px;margin-bottom:18px;border:none;border-radius:14px;background:url('button-big.png') center/cover no-repeat;color:white;font-size:16px;font-weight:bold;cursor:pointer;">
    Очистить игру
  </button>

  <div class="roles" id="roles"></div>

  <script>
    const roles = [
      'Детектив',
      'Доктор',
      'Телохранитель',
      'Любовница',
      'Ведьма',
      'Мафия',
      'Мафия',
      'Мафия',
      'Мафия',
      'Маньяк',
    ];

    const container = document.getElementById('roles');

    roles.forEach((role, index) => {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div class="role-name">${role}</div>

        <input type="text" placeholder="Имя игрока" />

        <div class="buttons">
          <button class="kill-btn"><img src="skull.png" class="icon"> <span>Жив</span></button>
          <button class="doctor-btn"><img src="heal.png" class="icon"> <span>Не лечил</span></button>
          <button class="lover-btn"><img src="kiss.png" class="icon"> <span>Не забрала</span></button>
          <button class="witch-btn"><img src="witch.png" class="icon"> <span>Не выбрано</span></button>
        </div>

        <div class="status">Статус: активен</div>
      `;

      const killBtn = card.querySelector('.kill-btn');
      const status = card.querySelector('.status');

      let dead = false;

      killBtn.addEventListener('click', () => {
        dead = !dead;

        if (dead) {
          card.classList.add('dead');
          killBtn.querySelector('span').textContent = 'Убит';
          
          status.textContent = 'Статус: выбыл из игры';
        } else {
          card.classList.remove('dead');
          killBtn.querySelector('span').textContent = 'Жив';
          
          status.textContent = 'Статус: активен';
        }
      });

      const loverBtn = card.querySelector('.lover-btn');

      let taken = false;

      loverBtn.addEventListener('click', () => {
        taken = !taken;

        if (taken) {
          loverBtn.querySelector('span').textContent = 'Забрала';
          
        } else {
          loverBtn.querySelector('span').textContent = 'Не забрала';
          
        }
      });

      const doctorBtn = card.querySelector('.doctor-btn');

      let healed = false;

      doctorBtn.addEventListener('click', () => {
        healed = !healed;

        if (healed) {
          doctorBtn.querySelector('span').textContent = 'Вылечен';
          
        } else {
          doctorBtn.querySelector('span').textContent = 'Не лечил';
          
        }
      });

      const witchBtn = card.querySelector('.witch-btn');

      let witchState = 0;

      witchBtn.addEventListener('click', () => {
        witchState++;

        if (witchState > 2) {
          witchState = 0;
        }

        if (witchState === 0) {
          witchBtn.querySelector('span').textContent = 'Не выбрано';
          
        }

        if (witchState === 1) {
          witchBtn.querySelector('span').textContent = 'Вылечила';
          witchBtn.className = 'witch-btn';
        }

        if (witchState === 2) {
          witchBtn.querySelector('span').textContent = 'Убила';
          
        }
      });

      container.appendChild(card);
    });

    document.getElementById('resetGame').addEventListener('click', () => {
      location.reload();
    });

    document.getElementById('closeTutorial').addEventListener('click', () => {
      document.getElementById('tutorialModal').style.display = 'none';
    });
  </script>
</body>
</html>
